<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Request Log</title>
    <meta name="description" content="Every Claude Code model request across your machines: cost, tokens, latency, by model, effort, agent and session." />
    <meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Before first paint, so a dark-mode viewer never sees a white flash.
      if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark')
    </script>
    <script type="module" src="./frontend.tsx" async></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
